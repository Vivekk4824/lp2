<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { font-family: sans-serif; max-width: 350px; margin: 80px auto; }
        input, button { width: 100%; padding: 9px; margin: 6px 0; box-sizing: border-box; }
        button { background: #1e3a8a; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        #err { color: red; font-size: 14px; }
    </style>
</head>
<body>
    <h2>Admin Login</h2>
    <p><small>Demo Credentials: <b>admin</b> / <b>admin123</b></small></p>
    <form id="loginForm">
        <input type="text" id="user" placeholder="Username" required>
        <input type="password" id="pass" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p id="err"></p>
    <script src="app.js"></script>
</body>
</html>
